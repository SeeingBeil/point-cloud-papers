name: build

on:
  push:
    paths: ["data/**", "scripts/**", "README.md", "docs/**"]
  pull_request:
    paths: ["data/**", "scripts/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate entries and regenerate README
        run: python scripts/build.py --check

      - name: Annotation on stale README
        if: failure()
        run: |
          echo "::error::README.md 与 data/entries.json 不同步。请在本地运行 python scripts/build.py 后提交生成结果。"
          exit 1
